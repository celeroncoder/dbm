name: Docker smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  adapters:
    name: Four-adapter live verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install from lockfile
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify Postgres, MySQL, Redis, and MongoDB
        run: bun run verify:docker
      - name: Prove exact cleanup
        if: always()
        run: |
          leftovers=$(docker ps -aq --filter label=com.dbm.managed=true --filter name=dbm-verify-plugin-)
          if [ -n "$leftovers" ]; then
            docker inspect "$leftovers"
            exit 1
          fi
