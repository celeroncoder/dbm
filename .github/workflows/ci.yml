name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  root:
    name: Root checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install from lockfile
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check tracked files
        run: bun run check:repository
      - name: Typecheck
        run: bun run check
      - name: Test
        run: bun run test

  plugin:
    name: BB plugin checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install plugin dependencies from lockfile
        working-directory: bb-plugin-dbm
        run: npm ci --install-links --ignore-scripts
      - name: Check BB SDK types
        working-directory: bb-plugin-dbm
        run: npx bb plugin types --check
      - name: Typecheck
        working-directory: bb-plugin-dbm
        run: npm run check
      - name: Test
        working-directory: bb-plugin-dbm
        run: npm run test
      - name: Build production plugin
        working-directory: bb-plugin-dbm
        run: npm run build

  fresh-install:
    name: Fresh package install
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Pack from a clean dependency install
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun pm pack --destination "${RUNNER_TEMP}"
      - name: Verify package contents
        run: tar -tf "${RUNNER_TEMP}"/*.tgz
      - name: Install and run the packed CLI
        run: |
          export BUN_INSTALL="${RUNNER_TEMP}/bun-prefix"
          bun add --global "${RUNNER_TEMP}"/*.tgz
          "${BUN_INSTALL}/bin/dbm" --version
          "${BUN_INSTALL}/bin/dbm" --help
          bun remove --global @celeroncoder/dbm
