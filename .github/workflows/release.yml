name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate and release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Validate release metadata
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
          test "$(node -p "require('./bb-plugin-dbm/package.json').version")" = "$(node -p "require('./package.json').version")"
          test -f LICENSE
          test -n "$(node -p "require('./package.json').license || ''")"
          test -n "$(node -p "require('./bb-plugin-dbm/package.json').license || ''")"
          test -f ".github/release-notes/${GITHUB_REF_NAME}.md"
          grep -F "## [${GITHUB_REF_NAME#v}] - " CHANGELOG.md
      - name: Install root dependencies from lockfile
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check root package
        run: |
          bun run check:repository
          bun run check
          bun run test
      - name: Install plugin dependencies from lockfile
        working-directory: bb-plugin-dbm
        run: npm ci --install-links --ignore-scripts
      - name: Check plugin package
        working-directory: bb-plugin-dbm
        run: |
          npx bb plugin types --check
          npm run check
          npm run test
          npm run build
      - name: Verify all database adapters against Docker
        run: bun run verify:docker
      - name: Pack release artifact
        run: |
          mkdir dist-release
          bun pm pack --destination dist-release
          tar -tf dist-release/*.tgz
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          path: .
          format: spdx-json
          output-file: dist-release/dbm-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate checksums
        working-directory: dist-release
        run: sha256sum *.tgz *.spdx.json > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist-release/* --latest --verify-tag --title "dbm ${GITHUB_REF_NAME}" --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md"
      - name: Prove exact Docker cleanup
        if: always()
        run: |
          leftovers=$(docker ps -aq --filter label=com.dbm.managed=true --filter name=dbm-verify-plugin-)
          if [ -n "$leftovers" ]; then
            docker inspect $leftovers
            exit 1
          fi
